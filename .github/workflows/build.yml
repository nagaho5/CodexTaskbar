name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate updater script
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw "tools\Update-CodexTaskbar.ps1")) | Out-Null

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify output
        shell: pwsh
        run: |
          $exe = "build\Release\CodexTaskbar.exe"
          if (!(Test-Path $exe)) { throw "CodexTaskbar.exe was not produced." }
          Get-Item $exe | Format-List Name,Length,FullName
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CodexTaskbar-windows-x64
          path: build/Release/CodexTaskbar.exe
          if-no-files-found: error
          retention-days: 7
